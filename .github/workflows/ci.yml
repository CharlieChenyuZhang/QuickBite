name: Frontend CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration-tools
      - run: python3 scripts/deploy-aws.test.py
      - run: npm run build
      - name: Build production container
        run: docker build -t quickbite-frontend:ci .
      - name: Check production proxy configuration
        run: docker run --rm -e BACKEND_ORIGIN=http://127.0.0.1:8081 quickbite-frontend:ci nginx -t
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
